[package]
name = "watergram"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Lexo Liu"]
description = "A Telegram client built with WaterUI"

[lib]
crate-type = ["lib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false
opt-level = 2

[features]
dev = ["waterui/dynamic_linking"]
# Video playback. Off by default: it links the framework's video stack, which
# on Linux needs VA-API 1.19+ and PipeWire 0.3.65+ to build. Enable it when the
# app uses video: `cargo build --features media`, or add it to `default`.
media = ["waterui/media"]

[dependencies.waterui]
default-features = false
git = "https://github.com/water-rs/waterui"
rev = "3b3d31a7b4444d0246f3604377bb6d92b9b29d07"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "espidf")))'.dependencies.waterui]
default-features = false
features = [
    "assets",
    "barcode",
    "flow-markdown",
    "media",
    "snackbar",
    "video",
    "video-gpu",
]
git = "https://github.com/water-rs/waterui"
rev = "3b3d31a7b4444d0246f3604377bb6d92b9b29d07"

[dependencies]
tdlib-rs = { version = "1.4.0", features = ["download-tdlib", "static"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
waterui-icons-material-icon = "0.5.1"
# `ContentMode` for `Photo::content_mode` lives in this crate; `Photo` does
# not re-export it.
waterui-image = "0.5.0"
# ModalInteraction (modal Escape scopes) is part of the backend contract
# crate; hydrolysis-m3 is dev-only so views can't reach its re-export.
waterui-backend-core = "0.5.2"
# Opens message URLs in the system browser (same mechanism waterui::link).
robius-open = "0.3"
waterkit-audio = "0.1.4"
waterkit-camera = "0.1.4"
waterkit-clipboard = "0.1.4"
waterkit-codec = "0.1.4"
waterkit-video-container = "0.1.4"
opus-pure = "0.2.1"
pollster = "1"
futures-lite = "2"
base64 = "0.22"
image = "0.25"
futures = "0.3"
arc-swap = "1.9.2"

[dev-dependencies]
waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "3b3d31a7b4444d0246f3604377bb6d92b9b29d07" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", rev = "cc8be840d96be39dc6f23aeace7310801d7a5f35" }
pollster = "1"

# Only the workspace root's patch table applies; this mirrors the dev channel's
# resolved patch set persisted in Water.toml (cherenkov engine, nami snapshot
# rename, wgpu Metal colorspace fix, component/scaffold migration pins).
