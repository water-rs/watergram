name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  PKG_CONFIG_PATH: /usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl-dev libgles-dev libglvnd-dev libfontconfig-dev libxkbcommon-dev \
            libgbm-dev libva-dev libpipewire-0.3-dev libspa-0.2-dev \
            libc++-dev libc++abi-dev \
            pkg-config curl ca-certificates gcc g++

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cargo cache
        uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --all-targets

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --lib
