name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -L /home/runner/.cargo-shims -l dylib=shim_c -l dylib=shim_cpp -C link-arg=-Wl,-rpath,/home/runner/.cargo-shims
  PKG_CONFIG_PATH: /usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
  RUST_TEST_THREADS: 1 # parallel #[waterui::test] mounts heap-corrupt (see DOGFOOD.md)

jobs:
  build-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl-dev libgles-dev libglvnd-dev libfontconfig-dev libxkbcommon-dev \
            libgbm-dev libspa-0.2-dev libc++-dev libc++abi-dev meson ninja-build \
            pkg-config curl ca-certificates gcc g++

      - name: libva 2.22 (stock 2.14 is too old for cros-libva)
        run: |
          set -e
          cd /tmp
          curl -LsSf -o libva.tar.gz https://github.com/intel/libva/archive/refs/tags/2.22.0.tar.gz
          tar xzf libva.tar.gz && cd libva-2.22.0
          meson setup build -Dwith_x11=yes -Dwith_glx=no -Dwith_wayland=no -Dwith_win32=no --prefix=/usr/local
          ninja -C build && sudo ninja -C build install
          sudo ldconfig

      - name: pipewire 1.0.7 headers (stock 0.3.48 lacks libspa 0.10 API)
        run: |
          set -e
          cd /tmp
          curl -LsSf -o pipewire.tar.gz https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/1.0.7/pipewire-1.0.7.tar.gz
          tar xzf pipewire.tar.gz
          sudo mkdir -p /usr/local/include/spa-0.2 /usr/local/include/pipewire-0.3
          sudo cp -r pipewire-1.0.7/spa/include/spa /usr/local/include/spa-0.2/
          sudo cp -r pipewire-1.0.7/src/pipewire /usr/local/include/pipewire-0.3/
          printf '#define SPA_VERSION_MAJOR 1\n#define SPA_VERSION_MINOR 0\n#define SPA_VERSION_MICRO 7\n' | sudo tee /usr/local/include/spa-0.2/spa/version.h >/dev/null
          printf 'prefix=/usr\nincludedir=/usr/local/include/spa-0.2\nlibdir=/usr/lib/x86_64-linux-gnu\nplugindir=${libdir}/spa-0.2\n\nName: libspa\nDescription: Simple Plugin API (patched headers 1.0.7)\nVersion: 1.0.7\nCflags: -I${includedir} -D_REENTRANT\n' | sudo tee /usr/local/lib/x86_64-linux-gnu/pkgconfig/libspa-0.2.pc
          printf 'prefix=/usr\nincludedir=/usr/local/include/pipewire-0.3\nlibdir=/usr/lib/x86_64-linux-gnu\n\nName: libpipewire\nDescription: PipeWire library (patched headers 1.0.7)\nVersion: 1.0.7\nLibs: -L${libdir} -lpipewire-0.3\nCflags: -I${includedir} -I/usr/local/include/spa-0.2\n' | sudo tee /usr/local/lib/x86_64-linux-gnu/pkgconfig/libpipewire-0.3.pc
          echo 'void __watergram_spa_stub(void){}' > /tmp/spa_stub.c
          gcc -shared -o /tmp/libspa-0.2.so /tmp/spa_stub.c
          sudo mv /tmp/libspa-0.2.so /usr/lib/x86_64-linux-gnu/libspa-0.2.so
          sudo ldconfig

      - name: tdlib link shims (glibc isoc23 + libc++ verbose_abort)
        run: |
          set -e
          mkdir -p "$HOME/.cargo-shims"
          printf '#include <stdlib.h>\nlong __isoc23_strtol(const char* n, char** e, int b){return strtol(n,e,b);}\n__attribute__((weak)) unsigned long __isoc23_strtoul(const char* n, char** e, int b){return strtoul(n,e,b);}\n__attribute__((weak)) long long __isoc23_strtoll(const char* n, char** e, int b){return strtoll(n,e,b);}\n__attribute__((weak)) unsigned long long __isoc23_strtoull(const char* n, char** e, int b){return strtoull(n,e,b);}\n' > /tmp/shim_c.c
          gcc -shared -fPIC -o "$HOME/.cargo-shims/libshim_c.so" /tmp/shim_c.c
          printf '#include <cstdarg>\n#include <cstdio>\n#include <cstdlib>\nnamespace std { inline namespace __1 {\n[[noreturn]] void __libcpp_verbose_abort(const char* fmt, ...) {\n    va_list ap; va_start(ap, fmt); vfprintf(stderr, fmt, ap); va_end(ap); abort();\n}}}\n' > /tmp/shim_cpp.cpp
          g++ -shared -fPIC -o "$HOME/.cargo-shims/libshim_cpp.so" /tmp/shim_cpp.cpp

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cargo cache
        uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --all-targets

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --lib
